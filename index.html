<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교생활 통합 조회</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E🏫%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563EB;
    --primary-dark: #1E40AF;
    --primary-light: #DBEAFE;
    --primary-soft: #EFF6FF;
    --sky: #38BDF8;
    --green: #22C55E;
    --yellow: #F59E0B;
    --red: #EF4444;
    --purple: #8B5CF6;
    --bg: #F6FAFF;
    --card: #FFFFFF;
    --text: #0F172A;
    --subtext: #334155;
    --muted: #64748B;
    --line: #E2E8F0;
    --line-soft: #EEF2F7;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.06);
    --radius: 22px;

    /* 기존 JS/CSS 호환용 이름 */
    --orange: var(--primary);
    --blue: var(--primary);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  body {
    font-family: 'Nanum Gothic', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 34%),
      linear-gradient(180deg, #F8FBFF 0%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  header {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    padding: 18px 24px;
    min-height: 68px;
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  header::before { display: none; }

  header h1 {
    width: 100%;
    max-width: 100%;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: clamp(17px, 4.3vw, 22px);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.6px;
    line-height: 1.25;
    text-align: center;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }

  header h1::before {
    content: '🏫';
    width: 30px;
    height: 30px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
  }
  header h1::after { display: none; }

  .school-bar, .class-bar {
    width: min(100% - 28px, 532px);
    margin: 12px auto 0;
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
  }
  .class-bar {
    margin-top: 8px;
  }
  .school-name, .class-name {
    font-weight: 800;
    font-size: 14px;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .school-name::before { content: '🏫 '; }
  .class-name::before { content: '👥 '; }
  .school-change, .class-change {
    font-size: 11px;
    color: var(--primary);
    background: var(--primary-soft);
    border: 1px solid rgba(37, 99, 235, 0.10);
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 800;
  }

  main {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px 32px;
  }

  /* 첫 화면 */
  .home-view {
    min-height: calc(100dvh - 104px);
    display: flex;
    flex-direction: column;
  }
  .start-screen {
    flex: 1;
    min-height: calc(100dvh - 118px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 22px;
    padding: 28px 10px 44px;
  }
  .start-logo {
    width: clamp(138px, 42vw, 190px);
    height: clamp(138px, 42vw, 190px);
    border-radius: 34px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.95), rgba(239,246,255,0.95)),
      var(--card);
    color: var(--primary);
    border: 1px solid rgba(191, 219, 254, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(58px, 16vw, 82px);
    box-shadow: 0 18px 42px rgba(37, 99, 235, 0.14);
    position: relative;
    overflow: hidden;
  }
  .start-logo::before,
  .start-logo::after {
    content: '';
    position: absolute;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.08);
  }
  .start-logo::before {
    width: 46px;
    height: 16px;
    left: 22px;
    top: 48px;
  }
  .start-logo::after {
    width: 52px;
    height: 18px;
    right: 20px;
    top: 58px;
  }
  .start-title-main {
    display: block;
    color: var(--text);
    font-size: clamp(29px, 7.5vw, 42px);
    font-weight: 800;
    letter-spacing: -1.2px;
    line-height: 1.22;
    white-space: nowrap;
  }
  .start-title-main::after {
    content: ' 정보를';
  }
  .start-title-sub {
    display: block;
    margin-top: 8px;
    color: var(--text);
    font-size: clamp(29px, 7.5vw, 42px);
    font-weight: 800;
    letter-spacing: -1.2px;
    line-height: 1.22;
  }
  .start-title-sub::before {
    content: '한 곳에서 ';
  }
  .start-title::after {
    content: '학사일정, 시간표, 급식 메뉴를 간편하게 조회할 수 있습니다.';
    display: block;
    max-width: 310px;
    margin: 18px auto 0;
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.7;
    letter-spacing: -0.35px;
  }
  .school-lookup-btn {
    width: min(100%, 340px);
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #1D4ED8, #2563EB 60%, #38BDF8);
    color: white;
    padding: 17px 22px;
    font-size: clamp(15px, 4vw, 18px);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 14px 28px rgba(37, 99, 235, 0.28);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }
  .school-lookup-btn::after { content: '›'; font-size: 24px; line-height: 1; }
  .school-lookup-btn:active {
    transform: scale(0.98);
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
    filter: brightness(0.98);
  }
  .school-lookup-btn + .storage-note,
  .storage-note {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .menu-screen {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding-top: 14px;
  }
  .home-menu {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }
  .home-card {
    min-height: 126px;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: var(--shadow-soft);
    padding: 22px 20px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .home-card:hover { border-color: rgba(37, 99, 235, 0.24); box-shadow: var(--shadow); }
  .home-card:active { transform: scale(0.985); }
  .home-card::after {
    content: '';
    position: absolute;
    right: -28px;
    top: -34px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.05);
  }
  .home-icon {
    width: 62px;
    height: 62px;
    border-radius: 22px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    z-index: 1;
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
  }
  .home-card:nth-child(2) .home-icon { background: #F0F9FF; }
  .home-card:nth-child(3) .home-icon { background: #ECFDF5; }
  .home-text { z-index: 1; flex: 1; min-width: 0; }
  .home-title {
    display: block;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 9px;
    letter-spacing: -0.4px;
  }
  .home-desc {
    display: block;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.55;
    word-break: keep-all;
  }
  .home-arrow {
    z-index: 1;
    color: var(--primary);
    font-size: 30px;
    font-weight: 800;
  }

  /* 모듈 공통 */
  .module-view { display: none; }
  .top-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .home-back {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.9);
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
  }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: var(--shadow-soft);
  }
  .date-nav button {
    background: var(--primary-soft);
    border: 1px solid rgba(37, 99, 235, 0.08);
    color: var(--primary);
    font-size: 20px;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .date-nav button:hover { background: var(--primary-light); }
  .date-label {
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.68);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
    padding: 6px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 5px;
    border-radius: 13px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    background: transparent;
    color: var(--muted);
    white-space: nowrap;
  }
  .tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 8px 16px rgba(37, 99, 235, 0.18);
  }
  .info-badge-row, .allergy-badge-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 0 0 14px;
  }
  .info-badge, .allergy-active-badge, .allergy-none-badge, .calorie-badge, .section-count {
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid rgba(37, 99, 235, 0.10);
    font-size: 11px;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .allergy-active-badge {
    background: #FEF2F2;
    color: var(--red);
    border-color: #FECACA;
  }
  .allergy-none-badge {
    background: #F8FAFC;
    color: var(--muted);
    border-color: var(--line);
  }

  .today-card, .calendar-grid, .setup-card, .week-card {
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow-soft);
    margin-bottom: 16px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-title, .setup-title {
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
  }
  .today-date, .detail-date {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 800;
  }
  .nav-btn {
    background: white;
    color: var(--primary);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .empty-state {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 44px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.65; font-weight: 700; }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid #E5E7EB;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* 목록형 카드 */
  .event-list, .menu-list, .period-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .event-card, .menu-item, .period-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px 13px;
    background: #F8FAFC;
    border-radius: 16px;
    border: 1px solid var(--line-soft);
    border-left: 4px solid var(--primary);
    animation: slideIn 0.25s ease both;
  }
  .event-card:nth-child(2), .menu-item:nth-child(2), .period-item:nth-child(2) { animation-delay: 0.04s; border-left-color: var(--sky); }
  .event-card:nth-child(3), .menu-item:nth-child(3), .period-item:nth-child(3) { animation-delay: 0.08s; border-left-color: var(--green); }
  .event-card:nth-child(4), .menu-item:nth-child(4), .period-item:nth-child(4) { animation-delay: 0.12s; border-left-color: var(--yellow); }
  .event-card:nth-child(5), .menu-item:nth-child(5), .period-item:nth-child(5) { animation-delay: 0.16s; border-left-color: var(--purple); }
  .event-card:nth-child(n+6), .menu-item:nth-child(n+6), .period-item:nth-child(n+6) { animation-delay: 0.20s; }

  .event-date-badge, .period-badge {
    min-width: 54px;
    border-radius: 14px;
    background: white;
    border: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    flex-shrink: 0;
  }
  .event-date-badge {
    flex-direction: column;
    padding: 8px 6px;
  }
  .event-date-badge .month { font-size: 10px; color: var(--muted); font-weight: 800; }
  .event-date-badge .day { font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--primary); }
  .event-date-badge .dow { font-size: 10px; color: var(--muted); font-weight: 800; }
  .period-badge {
    height: 34px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
  }
  .event-info, .subject-name, .menu-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.4;
    word-break: keep-all;
    color: var(--text);
  }
  .event-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
    align-items: center;
  }
  .event-type-tag, .grade-tag, .menu-allergy {
    font-size: 10.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: white;
    border: 1px solid var(--line-soft);
    color: var(--muted);
  }
  .event-type-tag.type-1 { background: var(--primary-soft); color: var(--primary); border-color: #BFDBFE; }
  .event-type-tag.type-2 { background: #ECFDF5; color: #15803D; border-color: #BBF7D0; }
  .event-type-tag.type-3 { background: #FEF2F2; color: var(--red); border-color: #FECACA; }
  .event-type-tag.type-4 { background: #FFFBEB; color: #B45309; border-color: #FDE68A; }
  .event-emoji, .menu-emoji, .subject-emoji {
    font-size: 20px;
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }

  /* 달력 */
  .calendar-grid { padding: 14px; }
  .cal-header, .cal-week {
    display: grid;
    gap: 5px;
  }
  .cal-header.cols-7, .cal-week.cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-header.cols-5, .cal-week.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .cal-header { margin-bottom: 8px; }
  .cal-day-label {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-day-label.sun { color: var(--red); }
  .cal-day-label.sat { color: var(--primary); }
  .cal-weeks { display: flex; flex-direction: column; gap: 5px; }
  .cal-cell {
    background: #F8FAFC;
    border-radius: 14px;
    padding: 7px 4px;
    min-height: 74px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--line-soft);
    min-width: 0;
    overflow: hidden;
  }
  .cal-cell:hover { border-color: rgba(37, 99, 235, 0.35); transform: translateY(-1px); }
  .cal-cell.today { border-color: var(--primary); background: var(--primary-soft); }
  .cal-cell.selected { background: var(--primary); border-color: var(--primary); }
  .cal-cell.selected .cal-date, .cal-cell.selected .cal-preview, .cal-cell.selected .cal-more { color: white; }
  .cal-cell.selected .event-pill { background: rgba(255,255,255,0.22); color: white; }
  .cal-cell.no-data { background: #F8FAFC; cursor: default; opacity: 0.55; }
  .cal-cell.no-data:hover { transform: none; border-color: var(--line-soft); }
  .cal-date {
    font-size: 11px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 5px;
    text-align: center;
  }
  .cal-cell.sun .cal-date { color: var(--red); }
  .cal-cell.sat .cal-date { color: var(--primary); }
  .cal-cell.today .cal-date { color: var(--primary); }
  .cal-cell.selected .cal-date { color: white; }
  .cal-preview {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .event-pill {
    display: block;
    width: 100%;
    padding: 2px 3px;
    border-radius: 6px;
    background: rgba(37, 99, 235, 0.10);
    color: var(--primary-dark);
    font-size: 8.5px;
    font-weight: 800;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .cal-more { font-size: 8.5px; color: var(--muted); text-align: center; margin-top: 1px; }
  .detail-card {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed #CBD5E1;
  }

  /* 주간 시간표 */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
  }
  .week-title {
    text-align: center;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 16px;
    font-weight: 800;
    flex: 1;
  }
  .week-table-wrap {
    overflow-x: hidden;
    padding-bottom: 2px;
    width: 100%;
  }
  .week-table {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 5px;
  }
  .week-table th {
    font-size: 10.5px;
    color: var(--muted);

  }
  .week-table th:first-child { width: 46px; }
  .week-table td {
    background: #F8FAFC;
    border: 1px solid var(--line-soft);

    text-align: center;

    font-weight: 800;
    min-height: 42px;

  }
  .week-table td.period-head {
    background: white;

  }
  .week-table td.empty { color: #CBD5E1; background: #F8FAFC; font-weight: 700; }

  /* 설정/알러지 */
  .setting-row, .search-row {

  .save-btn, .allergy-save-btn { width: 100%; margin-top: 10px; padding: 14px 18px; }
  .help-card, .allergy-info-card {

  .allergy-info-card {
    background: #FEF2F2;
    border-color: #FECACA;

  .allergy-section-title {
    font-family: 'Nanum Gothic', sans-serif;

  .allergy-grid {

  .allergy-chip {

    background: white;

    transition: all 0.15s;

    user-select: none;

  .allergy-chip.selected {

  }
  .allergy-chip-emoji { font-size: 22px; }
  .allergy-chip-name {
    font-size: 11px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }
  .allergy-chip.selected .allergy-chip-name { color: var(--red); }
  .allergy-chip-num {
    font-size: 9px;
    color: var(--muted);
    background: #F1F5F9;
    padding: 2px 6px;
    border-radius: 7px;
  }
  .menu-item.allergy-alert {
    background: #FEF2F2;
    border-color: #FECACA;

  }
  .menu-item.allergy-alert .menu-name { color: #B91C1C; }
  .menu-allergy.alert { background: #FEE2E2; color: var(--red); margin-left: auto; border-color: #FECACA; }
  .cal-allergy-dot {
    width: 6px; height: 6px;
    background: var(--red);
    border-radius: 50%;
    display: inline-block;
    margin-left: 2px;

  }
  .allergy-menu-text { color: var(--red); font-weight: 800; }

  /* 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 28px 28px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 560px;
    animation: slideUp 0.25s ease;
    position: relative;
    box-shadow: 0 -18px 40px rgba(15, 23, 42, 0.14);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }

  .modal h2 {
    font-family: 'Nanum Gothic', sans-serif;

    margin-bottom: 16px;
  }
  .search-results { max-height: 310px; overflow-y: auto; }
  .result-item {
    padding: 13px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.1s;
    border: 1px solid transparent;
    border-bottom-color: var(--line-soft);
  }
  .result-item:hover { background: var(--primary-soft); border-color: #BFDBFE; }
  .result-name { font-weight: 800; font-size: 14px; color: var(--text); }
  .result-addr { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; font-weight: 700; }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: #F8FAFC;
    border: 1px solid var(--line);
    color: var(--muted);

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(80px);

    color: white;
    font-size: 13px;
    font-weight: 800;
    padding: 11px 17px;
    border-radius: 999px;
    z-index: 200;
    transition: transform 0.25s ease;
    white-space: nowrap;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  @media (max-width: 420px) {
    header { padding-left: 18px; padding-right: 18px; }
    main { padding: 14px 14px 28px; }
    .school-bar, .class-bar { width: calc(100% - 28px); }
    .start-screen { gap: 20px; padding-bottom: 38px; }
    .start-logo { border-radius: 30px; }
    .home-card { min-height: 118px; padding: 18px; gap: 13px; }
    .home-icon { width: 56px; height: 56px; font-size: 29px; border-radius: 19px; }
    .home-title { font-size: 18px; }
    .home-desc { font-size: 12px; }
    .tab { font-size: 11.5px; padding: 9px 2px; }
    .today-card, .setup-card, .week-card { padding: 16px; }
    .calendar-grid { padding: 10px; }
    .cal-header, .cal-week { gap: 3px; }
    .cal-cell { min-height: 66px; padding: 5px 2px; border-radius: 11px; }
    .event-pill { font-size: 8px; padding: 2px; }
    .event-card, .menu-item, .period-item { gap: 8px; padding: 11px; }
    .event-date-badge { min-width: 48px; }
    .event-info, .subject-name, .menu-name { font-size: 14px; }
    .week-table { border-spacing: 3px; }

    .week-table th:first-child { width: 42px; }

</style>

<body>

<header>
  <h1 id="appTitle">학교생활 통합 조회</h1>
</header>

<div class="school-bar hidden" id="schoolBar" onclick="openSchoolModal()">
  <span class="school-name" id="schoolNameDisplay">인천예송초등학교</span>
  <span class="school-change">학교 선택 ›</span>
</div>
<div class="class-bar hidden" id="classBar" onclick="switchSubView('setup')">
  <span class="class-name" id="classNameDisplay">6학년 1반</span>
  <span class="class-change">학급 설정 ›</span>
</div>

<main>
  <section class="home-view" id="homeView">
    <div class="start-screen" id="startScreen">
      <div class="start-logo">🏫</div>
      <div class="start-title" aria-label="학교생활 통합 조회">
        <span class="start-title-main">학교생활</span>
        <span class="start-title-sub">통합 조회</span>
      </div>
      <button class="school-lookup-btn" onclick="openSchoolModal()">학교 선택하기</button>
      <p class="storage-note">🔒 선택한 학교 정보는 이 기기에만 저장됩니다.</p>
    </div>

    <div class="menu-screen" id="menuScreen">
      <div class="home-menu">
        <button class="home-card" onclick="openModule('schedule')">
          <span class="home-icon">📅</span>
          <span class="home-text">
            <span class="home-title">학사일정</span>
            <span class="home-desc">월별 행사와 학년별 일정을 확인합니다.</span>
          </span>
          <span class="home-arrow">›</span>
        </button>

        <button class="home-card" onclick="openModule('timetable')">
          <span class="home-icon">📚</span>
          <span class="home-text">
            <span class="home-title">시간표</span>
            <span class="home-desc">학년·반을 설정하고 날짜별/주간 시간표를 봅니다.</span>
          </span>
          <span class="home-arrow">›</span>
        </button>

        <button class="home-card" onclick="openModule('meal')">
          <span class="home-icon">🍱</span>
          <span class="home-text">
            <span class="home-title">급식</span>
            <span class="home-desc">오늘의 급식과 알러지 성분을 확인합니다.</span>
          </span>
          <span class="home-arrow">›</span>
        </button>
      </div>
    </div>
  </section>

  <section class="module-view" id="moduleView">
    <div class="top-actions">
      <button class="home-back" onclick="showServiceMenu()">‹ 메뉴</button>
    </div>

    <div class="date-nav" id="dateNav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="tabs" id="moduleTabs"></div>
    <div class="info-badge-row" id="infoBadgeRow"></div>
    <div id="moduleContent"></div>
  </section>
</main>

<!-- School Search Modal -->
<div class="modal-overlay" id="schoolModal" onclick="closeModalOutside(event, 'schoolModal')">
  <div class="modal">
    <button class="modal-close" onclick="closeSchoolModal()">✕</button>
    <h2>학교 검색</h2>
    <div class="search-row">
      <input type="text" class="search-input" id="schoolSearch" placeholder="학교 이름 입력 (예: 예송초)" onkeydown="if(event.key==='Enter')searchSchool()">
      <button class="search-btn" onclick="searchSchool()">검색</button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="empty-state" style="padding:20px">
        <p>학교명을 입력하고 검색하세요</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// The real key is kept only on the deployed server in NEIS_API_KEY.
const NEIS_KEY = '';
const NEIS_PROXY_URL = '/api/neis';

// Convert the existing NEIS requests into same-origin proxy requests. This
// removes the key from every browser request as well as from the source code.
const browserFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const requestUrl = typeof input === 'string' ? input : input.url;
  const url = new URL(requestUrl, window.location.origin);

  if (url.origin === 'https://open.neis.go.kr' && url.pathname.startsWith('/hub/')) {
    const query = new URLSearchParams(url.search);
    query.delete('KEY');
    query.set('endpoint', url.pathname.split('/').pop());
    return browserFetch(`${NEIS_PROXY_URL}?${query.toString()}`, init);
  }

  return browserFetch(input, init);
};

const DEFAULT_SCHOOL = {
  ATPT_OFCDC_SC_CODE: 'E10',
  SD_SCHUL_CODE: '7341401',
  name: '인천예송초등학교'
};

const state = {
  school: JSON.parse(localStorage.getItem('eduHub_school') || 'null') || DEFAULT_SCHOOL,
  module: 'home',
  schedule: { date: new Date(), view: 'list', selectedDay: null, cache: {} },
  timetable: {
    date: new Date(),
    view: 'day',
    selectedDay: null,
    cache: {},
    classSetting: JSON.parse(localStorage.getItem('eduHub_classSetting') || 'null') || { grade: '6', classNm: '1' }
  },
  meal: { date: new Date(), view: 'day', selectedDay: null, cache: {} }
};

let schoolSearchRows = [];
let toastTimer = null;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function yyyymm(d) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function yyyymmdd(d) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
}
function dateFromYmd(ds) {
  return new Date(parseInt(ds.slice(0,4),10), parseInt(ds.slice(4,6),10)-1, parseInt(ds.slice(6,8),10));
}
function dayName(d) {
  return ['일','월','화','수','목','금','토'][d.getDay()];
}
function addDays(d, amount) {
  const n = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  n.setDate(n.getDate() + amount);
  return n;
}
function mondayOf(d) {
  const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = base.getDay() === 0 ? -6 : 1 - base.getDay();
  base.setDate(base.getDate() + diff);
  return base;
}
function lastDayOfMonth(yearMonth) {
  const year = parseInt(yearMonth.slice(0, 4), 10);
  const month = parseInt(yearMonth.slice(4, 6), 10);
  return new Date(year, month, 0).getDate();
}
function schoolYearOf(d) {
  return d.getMonth() < 2 ? String(d.getFullYear() - 1) : String(d.getFullYear());
}
function semesterOf(d) {
  const m = d.getMonth() + 1;
  return (m >= 3 && m <= 8) ? '1' : '2';
}

function init() {
  updateSchoolDisplay();
  updateClassDisplay();

  const savedSchool = localStorage.getItem('eduHub_school');

  if (savedSchool) {
    showServiceMenu();
  } else {
    showHome();
  }
}
init();

function updateSchoolDisplay() {
  document.getElementById('schoolNameDisplay').textContent = state.school.name;
}
function updateClassDisplay() {
  const c = state.timetable.classSetting;
  document.getElementById('classNameDisplay').textContent = `${c.grade}학년 ${c.classNm}반`;
}

function showHome() {
  state.module = 'home';
  document.getElementById('homeView').style.display = 'flex';
  document.getElementById('moduleView').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('schoolBar').classList.add('hidden');
  document.getElementById('classBar').classList.add('hidden');
  document.getElementById('appTitle').textContent = '학교생활 통합 조회';
  document.querySelector('.school-change').textContent = '학교 선택 ›';
}

function showServiceMenu() {
  state.module = 'home';
  document.getElementById('homeView').style.display = 'flex';
  document.getElementById('moduleView').style.display = 'none';
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('menuScreen').style.display = 'flex';
  document.getElementById('schoolBar').classList.remove('hidden');
  document.getElementById('classBar').classList.add('hidden');
  document.getElementById('appTitle').textContent = '학교생활 통합 조회';
  document.querySelector('.school-change').textContent = '학교 변경 ›';
}

function openModule(moduleName) {
  state.module = moduleName;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('moduleView').style.display = 'block';
  document.getElementById('schoolBar').classList.remove('hidden');
  document.getElementById('classBar').classList.toggle('hidden', moduleName !== 'timetable');
  document.getElementById('appTitle').textContent = '학교생활 통합 조회';
  document.querySelector('.school-change').textContent = '학교 변경 ›';
  renderModule();
}

function getModuleState() {
  return state[state.module];
}

function changeMonth(delta) {
  const s = getModuleState();
  if (!s || !s.date) return;
  s.date = new Date(s.date.getFullYear(), s.date.getMonth() + delta, 1);
  s.selectedDay = null;
  renderModule();
}

function switchSubView(viewName) {
  const s = getModuleState();
  if (!s) return;
  s.view = viewName;
  renderModule();
}

function renderModule() {
  if (state.module === 'home') return;
  const s = getModuleState();
  document.getElementById('dateLabel').textContent = `${s.date.getFullYear()}년 ${s.date.getMonth() + 1}월`;
  renderTabs();
  renderInfoBadges();

  if (state.module === 'schedule') {
    if (state.schedule.view === 'list') renderScheduleList();
    else renderScheduleCalendar();
  } else if (state.module === 'timetable') {
    if (state.timetable.view === 'day') renderTimetableDay();
    else if (state.timetable.view === 'week') renderTimetableWeek();
    else if (state.timetable.view === 'cal') renderTimetableCalendar();
    else renderTimetableSetup();
  } else if (state.module === 'meal') {
    if (state.meal.view === 'day') renderMealDay();
    else if (state.meal.view === 'cal') renderMealCalendar();
    else renderAllergyPage();
  }
}

function renderTabs() {
  const tabsEl = document.getElementById('moduleTabs');
  let tabs = [];
  const s = getModuleState();

  if (state.module === 'schedule') {
    tabs = [
      ['list', '📋 일정목록'],
      ['cal', '🗓 달력보기']
    ];
  } else if (state.module === 'timetable') {
    tabs = [
      ['day', '📅 날짜별'],
      ['week', '🧾 주간표'],
      ['cal', '🗓 달력'],
      ['setup', '⚙️ 설정']
    ];
  } else {
    tabs = [
      ['day', '📅 날짜별'],
      ['cal', '🗓 달력보기'],
      ['allergy', '⚠️ 알러지']
    ];
  }

  tabsEl.innerHTML = tabs.map(([key, label]) => (
    `<div class="tab ${s.view === key ? 'active' : ''}" onclick="switchSubView('${key}')">${label}</div>`
  )).join('');
}

function renderInfoBadges() {
  const el = document.getElementById('infoBadgeRow');
  const schoolBadge = `<span class="info-badge">🏫 ${esc(state.school.name)}</span>`;

  if (state.module === 'schedule') {
    el.innerHTML = schoolBadge + `<button class="info-badge" style="border:none;cursor:pointer;font-family:'Nanum Gothic',sans-serif" onclick="goToday()">오늘</button>`;
  } else if (state.module === 'timetable') {
    const c = state.timetable.classSetting;
    el.innerHTML = schoolBadge + `<span class="info-badge">👥 ${esc(c.grade)}학년 ${esc(c.classNm)}반</span>`;
  } else {
    updateAllergyBadgeBar(el, schoolBadge);
  }
}

function goToday() {
  const today = new Date();
  const s = getModuleState();
  if (!s) return;
  s.date = today;
  s.selectedDay = null;
  renderModule();
}

/* 학교 검색 */
function openSchoolModal() {
  document.getElementById('schoolModal').classList.add('open');
  setTimeout(() => document.getElementById('schoolSearch').focus(), 150);
}
function closeSchoolModal() {
  document.getElementById('schoolModal').classList.remove('open');
}
function closeModalOutside(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove('open');
}
async function searchSchool(query) {
  const q = query || document.getElementById('schoolSearch').value.trim();
  if (!q) return;

  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = '<div style="text-align:center;padding:20px">검색 중<span class="spinner"></span></div>';

  const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=20`
    + `&SCHUL_NM=${encodeURIComponent(q)}&SCHUL_KND_SC_NM=${encodeURIComponent('초등학교')}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    const rows = data?.schoolInfo?.[1]?.row || [];
    schoolSearchRows = rows;

    if (rows.length === 0) {
      resultsEl.innerHTML = '<div class="empty-state"><p>검색 결과가 없어요<br>다른 이름으로 검색해보세요</p></div>';
      return;
    }

    resultsEl.innerHTML = rows.map((r, index) => `
      <div class="result-item" onclick="selectSchoolFromResult(${index})">
        <div class="result-name">${esc(r.SCHUL_NM)}</div>
        <div class="result-addr">${esc(r.ORG_RDNMA || r.LCTN_SC_NM || '')}</div>
      </div>
    `).join('');
  } catch(e) {
    resultsEl.innerHTML = '<div class="empty-state"><p>검색 중 오류가 발생했어요</p></div>';
  }
}
function selectSchoolFromResult(index) {
  const r = schoolSearchRows[index];
  if (!r) return;

  state.school = {
    ATPT_OFCDC_SC_CODE: r.ATPT_OFCDC_SC_CODE,
    SD_SCHUL_CODE: r.SD_SCHUL_CODE,
    name: r.SCHUL_NM
  };

/* 학사일정 */
async function fetchSchedules(yearMonth) {
  const cacheKey = `${state.school.SD_SCHUL_CODE}_${yearMonth}`;
  if (state.schedule.cache[cacheKey]) return state.schedule.cache[cacheKey];

  const lastDay = lastDayOfMonth(yearMonth);
  const fromYmd = `${yearMonth}01`;
  const toYmd = `${yearMonth}${String(lastDay).padStart(2, '0')}`;

  const url = `https://open.neis.go.kr/hub/SchoolSchedule?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=100`
    + `&ATPT_OFCDC_SC_CODE=${encodeURIComponent(state.school.ATPT_OFCDC_SC_CODE)}`
    + `&SD_SCHUL_CODE=${encodeURIComponent(state.school.SD_SCHUL_CODE)}`
    + `&AA_FROM_YMD=${fromYmd}`
    + `&AA_TO_YMD=${toYmd}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.RESULT) {
      state.schedule.cache[cacheKey] = {};
      return {};
    }
    const rows = data?.SchoolSchedule?.[1]?.row || [];
    const map = {};
    rows.forEach(r => {
      const date = r.AA_YMD;
      if (!date) return;
      (map[date] = map[date] || []).push({
        date,
        name: r.EVENT_NM || '학사일정',
        content: r.EVENT_CNTNT || '',
        type: r.EVENT_CRGR_SC_NM || '학사일정',
        grades: gradeScopeText(r)
      });
    });
    Object.keys(map).forEach(k => map[k].sort((a,b) => a.name.localeCompare(b.name, 'ko')));
    state.schedule.cache[cacheKey] = map;
    return map;
  } catch(e) {
    showToast('일정을 불러오지 못했어요');
    return {};
  }
}
function gradeScopeText(r) {
  const gradeKeys = [
    ['1학년', 'ONE_GRADE_EVENT_YN'],
    ['2학년', 'TW_GRADE_EVENT_YN'],
    ['3학년', 'THREE_GRADE_EVENT_YN'],
    ['4학년', 'FR_GRADE_EVENT_YN'],
    ['5학년', 'FIV_GRADE_EVENT_YN'],
    ['6학년', 'SIX_GRADE_EVENT_YN']
  ];
  const selected = gradeKeys.filter(([_, key]) => r[key] === 'Y').map(([label]) => label);
  if (selected.length === 0 || selected.length === 6) return '전체';
  return selected.join(', ');
}
function eventEmoji(ev) {
  const name = `${ev.name} ${ev.type}`;
  if (name.includes('방학') || name.includes('휴업') || name.includes('휴교')) return '🏖';
  if (name.includes('개학') || name.includes('입학') || name.includes('졸업')) return '🎓';
  if (name.includes('체험') || name.includes('현장') || name.includes('수학여행')) return '🚌';
  if (name.includes('평가') || name.includes('시험')) return '📝';
  if (name.includes('운동') || name.includes('체육')) return '🏃';
  return '📌';
}
function eventTypeClass(type) {
  if (!type) return 'type-1';
  if (type.includes('방학') || type.includes('휴업') || type.includes('휴교')) return 'type-3';
  if (type.includes('개학') || type.includes('입학') || type.includes('졸업')) return 'type-2';
  if (type.includes('시험') || type.includes('평가')) return 'type-4';
  return 'type-1';
}

/* 시간표 */
async function fetchTimetable(yearMonth) {
  const monthDate = new Date(parseInt(yearMonth.slice(0,4),10), parseInt(yearMonth.slice(4,6),10) - 1, 15);
  const ay = schoolYearOf(monthDate);
  const sem = semesterOf(monthDate);
  const c = state.timetable.classSetting;
  const cacheKey = `${state.school.SD_SCHUL_CODE}_${c.grade}_${c.classNm}_${yearMonth}_${ay}_${sem}`;
  if (state.timetable.cache[cacheKey]) return state.timetable.cache[cacheKey];

  const lastDay = lastDayOfMonth(yearMonth);
  const fromYmd = `${yearMonth}01`;
  const toYmd = `${yearMonth}${String(lastDay).padStart(2, '0')}`;

  const url = `https://open.neis.go.kr/hub/elsTimetable?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=1000`
    + `&ATPT_OFCDC_SC_CODE=${encodeURIComponent(state.school.ATPT_OFCDC_SC_CODE)}`
    + `&SD_SCHUL_CODE=${encodeURIComponent(state.school.SD_SCHUL_CODE)}`
    + `&AY=${encodeURIComponent(ay)}`
    + `&SEM=${encodeURIComponent(sem)}`
    + `&GRADE=${encodeURIComponent(c.grade)}`
    + `&CLASS_NM=${encodeURIComponent(c.classNm)}`
    + `&TI_FROM_YMD=${fromYmd}`
    + `&TI_TO_YMD=${toYmd}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.RESULT) {
      state.timetable.cache[cacheKey] = {};
      return {};
    }
    const rows = data?.elsTimetable?.[1]?.row || [];
    const map = {};
    rows.forEach(r => {
      const ds = r.ALL_TI_YMD;
      if (!ds) return;
      if (!map[ds]) map[ds] = [];
      map[ds].push({
        period: parseInt(r.PERIO || '0', 10) || 0,
        subject: (r.ITRT_CNTNT || '').replace(/<br\/?\s*>/gi, ' ').trim() || '수업'
      });
    });
    Object.values(map).forEach(list => list.sort((a, b) => a.period - b.period));
    state.timetable.cache[cacheKey] = map;
    return map;
  } catch(e) {
    showToast('시간표를 불러오지 못했어요');
    return {};
  }
}
async function getTimetableForRange(startDate, endDate) {
  const map = {};
  const cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  const endCursor = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
  while (cursor <= endCursor) {
    const monthMap = await fetchTimetable(yyyymm(cursor));
    Object.assign(map, monthMap);
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return map;
}
function subjectEmoji(name) {
  const n = String(name).trim();
  const map = [
    ['국어','📖'], ['수학','➗'], ['사회','🌏'], ['과학','🔬'], ['영어','🔤'],
    ['음악','🎵'], ['미술','🎨'], ['체육','⚽'], ['실과','🛠'], ['도덕','🤝'],
    ['창체','✨'], ['창의','✨'], ['진로','🧭'], ['자율','🌱'], ['동아리','🎒'],
    ['안전','🛡'], ['보건','🩺'], ['정보','💻']
  ];
  for (const [k,v] of map) if (n.includes(k)) return v;
  return '✏️';
}

  const maxPeriod = Math.max(6, ...days.map(d => (data[yyyymmdd(d)] || []).reduce((m, x) => Math.max(m, x.period), 0)));

  let rows = '';
  for (let p = 1; p <= maxPeriod; p++) {
    rows += `<tr><td class="period-head">${p}교시</td>`;
    days.forEach(d => {
      const ds = yyyymmdd(d);

}
function selectMealDay(ds) {
  state.meal.selectedDay = state.meal.selectedDay === ds ? null : ds;
  renderMealCalendar();
}

/* 공통 달력 렌더러 */
function renderMonthCalendar({ date, dataMap, mode, cols, selectedDay }) {
  const year = date.getFullYear();
  const month = date.getMonth();
  const todayStr = yyyymmdd(new Date());
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  if (cols === 7) {
    return renderSevenColumnCalendar(year, month, daysInMonth, dataMap, mode, selectedDay, todayStr);
  }
  return renderFiveColumnCalendar(year, month, daysInMonth, dataMap, mode, selectedDay, todayStr);
}
function renderSevenColumnCalendar(year, month, daysInMonth, dataMap, mode, selectedDay, todayStr) {
  const firstDay = new Date(year, month, 1).getDay();
  const labels = ['일','월','화','수','목','금','토'];
  const cellArr = [];

  for (let i = 0; i < firstDay; i++) {
    cellArr.push(`<div class="cal-cell no-data" style="visibility:hidden"></div>`);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const dow = dateObj.getDay();
    const ds = yyyymmdd(dateObj);
    const events = dataMap[ds] || [];
    const isToday = ds === todayStr;
    const isSelected = selectedDay === ds;
    cellArr.push(`<div class="cal-cell ${dow===0?'sun':''} ${dow===6?'sat':''} ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectScheduleDay('${ds}')">
      <div class="cal-date">${d}</div>
      <div class="cal-preview">
        ${events.slice(0,2).map(ev => `<span class="event-pill">${esc(ev.name)}</span>`).join('')}
        ${events.length > 2 ? `<span class="cal-more">+${events.length-2}개</span>` : ''}
      </div>
    </div>`);
  }

  const remaining = (7 - (cellArr.length % 7)) % 7;
  for (let i = 0; i < remaining; i++) {
    cellArr.push(`<div class="cal-cell no-data" style="visibility:hidden"></div>`);
  }

  const weekRows = [];
  for (let i = 0; i < cellArr.length; i += 7) {
    weekRows.push(`<div class="cal-week cols-7">${cellArr.slice(i, i + 7).join('')}</div>`);
  }

  const detail = selectedDay && dataMap[selectedDay]
    ? `<div class="detail-card">
        <div class="detail-date">${formatDateLabel(selectedDay)} 일정</div>
        <div class="event-list">${dataMap[selectedDay].map(renderEventCard).join('')}</div>
      </div>`
    : '';

  return `
    <div class="calendar-grid">
      <div class="cal-header cols-7">${labels.map((l,i)=>`<div class="cal-day-label ${i===0?'sun':''} ${i===6?'sat':''}">${l}</div>`).join('')}</div>
      <div class="cal-weeks">${weekRows.join('')}</div>
      ${detail}
    </div>`;
}

function renderFiveColumnCalendar(year, month, daysInMonth, dataMap, mode, selectedDay, todayStr) {
  const labels = ['월','화','수','목','금'];
  const weeks = [];
  let week = [];

  for (let d = 1; d <= daysInMonth; d++) {
    const dd = new Date(year, month, d);
    const dow = dd.getDay();
    if (dow === 0 || dow === 6) continue;
    week.push(dd);
    if (dow === 5) { weeks.push(week); week = []; }
  }
  if (week.length > 0) weeks.push(week);

  const weeksHtml = weeks.map(w => {
    const cells = Array(5).fill(null);
    w.forEach(d => { cells[d.getDay() - 1] = d; });

    return `<div class="cal-week cols-5">${cells.map(d => {
      if (!d) return `<div class="cal-cell no-data" style="visibility:hidden"></div>`;
      const ds = yyyymmdd(d);
      const data = dataMap[ds];
      const isToday = ds === todayStr;
      const isSelected = selectedDay === ds;
      const hasAllergyDay = mode === 'meal' && data && myAllergies.size > 0 && data.menus.some(m => hasMyAllergy(m));
      const click = mode === 'meal' ? `selectMealDay('${ds}')` : `selectTimetableDay('${ds}')`;
      return `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="${click}">
        <div class="cal-date">${d.getDate()}${hasAllergyDay ? '<span class="cal-allergy-dot"></span>' : ''}</div>
        <div class="cal-preview">${renderCalendarPreview(mode, data)}</div>
      </div>`;
    }).join('')}</div>`;
  }).join('');

  const detail = selectedDay && dataMap[selectedDay]
    ? renderFiveColumnDetail(mode, selectedDay, dataMap[selectedDay])
    : '';

  return `
    <div class="calendar-grid">
      <div class="cal-header cols-5">${labels.map(l=>`<div class="cal-day-label">${l}</div>`).join('')}</div>
      <div class="cal-weeks">${weeksHtml}</div>
      ${detail}
    </div>`;
}
function renderCalendarPreview(mode, data) {
  if (!data) return `<span style="font-size:9px;color:#ccc;text-align:center">정보없음</span>`;

  if (mode === 'timetable') {
    return data.slice(0,5).map(item => `<span class="event-pill">${esc(item.period)}교시 ${esc(item.subject)}</span>`).join('');
  }

  if (mode === 'meal') {
    return data.menus.slice(0,4).map(m => {
      const name = m.replace(/\(.*?\)/g,'').trim();
      return `<span class="event-pill ${hasMyAllergy(m) ? 'allergy-menu-text' : ''}">${esc(name)}</span>`;
    }).join('');
  }

  return '';
}
function renderFiveColumnDetail(mode, selectedDay, data) {
  if (mode === 'timetable') {
    return `<div class="detail-card">
      <div class="detail-date">${formatDateLabel(selectedDay)} 시간표</div>
      <div class="period-list">
        ${data.map(item => `
          <div class="period-item" style="animation:none">
            <span class="period-badge">${item.period}교시</span>
            <span class="subject-emoji">${subjectEmoji(item.subject)}</span>
            <span class="subject-name">${esc(item.subject)}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  return `<div class="detail-card">
    <div class="detail-date">${formatDateLabel(selectedDay)} 급식</div>
    <div class="menu-list">${data.menus.map(renderMenuItem).join('')}</div>
    ${data.cal ? `<div style="margin-top:10px"><span class="calorie-badge">🔥 ${esc(data.cal)}</span></div>` : ''}
  </div>`;
}
function chunkCells(cellsHtml, cols, className) {
  const parts = cellsHtml.split('</div>').filter(Boolean).map(x => x + '</div>');
  const weeks = [];
  for (let i = 0; i < parts.length; i += cols) {
    weeks.push(`<div class="cal-week ${className}">${parts.slice(i, i + cols).join('')}</div>`);
  }
  return weeks.join('');
}
function formatDateLabel(ds) {
  const d = dateFromYmd(ds);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dayName(d)})`;
}

/* 알러지 */
const ALLERGY_MAP = [
  { num: 1, name: '난류', emoji: '🥚' },
  { num: 2, name: '우유', emoji: '🥛' },
  { num: 3, name: '메밀', emoji: '🌾' },
  { num: 4, name: '땅콩', emoji: '🥜' },
  { num: 5, name: '대두', emoji: '🫘' },
  { num: 6, name: '밀', emoji: '🍞' },
  { num: 7, name: '고등어', emoji: '🐟' },
  { num: 8, name: '게', emoji: '🦀' },
  { num: 9, name: '새우', emoji: '🦐' },
  { num: 10, name: '돼지고기', emoji: '🐷' },
  { num: 11, name: '복숭아', emoji: '🍑' },
  { num: 12, name: '토마토', emoji: '🍅' },
  { num: 13, name: '아황산류', emoji: '⚗️' },
  { num: 14, name: '호두', emoji: '🌰' },
  { num: 15, name: '닭고기', emoji: '🍗' },
  { num: 16, name: '쇠고기', emoji: '🥩' },
  { num: 17, name: '오징어', emoji: '🦑' },
  { num: 18, name: '조개류', emoji: '🐚' }
];

let myAllergies = new Set(JSON.parse(localStorage.getItem('eduHub_myAllergies') || '[]'));

function parseAllergyNums(menuStr) {
  const m = String(menuStr).match(/\(([^)]+)\)/);
  if (!m) return new Set();
  return new Set(m[1].split('.').map(n => parseInt(n, 10)).filter(n => !isNaN(n)));
}
function hasMyAllergy(menuStr) {
  if (myAllergies.size === 0) return false;
  const nums = parseAllergyNums(menuStr);
  for (const n of myAllergies) if (nums.has(n)) return true;
  return false;
}
function matchingAllergies(menuStr) {
  const nums = parseAllergyNums(menuStr);
  const matched = [];
  for (const n of myAllergies) {
    if (nums.has(n)) {
      const info = ALLERGY_MAP.find(a => a.num === n);
      if (info) matched.push(info.name);
    }
  }
  return matched;
}
function updateAllergyBadgeBar(el, prefixHtml = '') {
  if (myAllergies.size === 0) {
    el.innerHTML = prefixHtml + `<span class="allergy-none-badge">⚠️ 알러지 미설정</span>`;
    return;
  }
  const badges = [...myAllergies].map(n => {
    const info = ALLERGY_MAP.find(a => a.num === n);
    return info ? `<span class="allergy-active-badge">${info.emoji} ${info.name}</span>` : '';
  }).join('');
  el.innerHTML = prefixHtml + badges;
}
function renderAllergyPage() {
  const chipsHtml = ALLERGY_MAP.map(a => `
    <div class="allergy-chip ${myAllergies.has(a.num) ? 'selected' : ''}"
         onclick="toggleAllergy(${a.num})" id="chip-${a.num}">
      <span class="allergy-chip-emoji">${a.emoji}</span>
      <span class="allergy-chip-name">${a.name}</span>
      <span class="allergy-chip-num">${a.num}번</span>
    </div>
  `).join('');

  document.getElementById('moduleContent').innerHTML = `
    <div class="today-card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:24px">⚠️</span>
        <div>
          <div style="font-family:'Black Han Sans',sans-serif;font-size:16px">알러지 설정</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">해당하는 알러지를 모두 선택하세요</div>
        </div>
      </div>
      <div class="help-card">
        📌 선택한 알러지 성분이 포함된 메뉴는 <strong>빨간색</strong>으로 표시됩니다.<br>
        NEIS 알러지 번호 기준으로 확인합니다.
      </div>
      <div class="allergy-section-title">🔍 알러지 항목 선택</div>
      <div class="allergy-grid">${chipsHtml}</div>
      <button class="allergy-save-btn" onclick="saveAllergySettings()">✅ 설정 저장하기</button>
    </div>
  `;
}
function toggleAllergy(num) {
  const chip = document.getElementById('chip-' + num);
  if (myAllergies.has(num)) {
    myAllergies.delete(num);
    chip.classList.remove('selected');
  } else {
    myAllergies.add(num);
    chip.classList.add('selected');
  }
}
function saveAllergySettings() {
  localStorage.setItem('eduHub_myAllergies', JSON.stringify([...myAllergies]));
  showToast('알러지 설정이 저장되었어요');
  state.meal.view = 'day';
  renderModule();
}

/* Toast */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
